[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "goldagent"
version = "1.0.0"
description = "Production-oriented gold market analysis agent"
requires-python = ">=3.12"
dependencies = [
  "aiosqlite>=0.20", "akshare>=1.11", "alembic>=1.13", "fastapi>=0.116", "httpx>=0.28",
  "langchain-core>=1.0", "langgraph>=1.0", "langgraph-checkpoint-postgres>=3.0", "mcp>=1.9", "numpy>=1.24", "pandas>=2.3",
  "pandas-ta==0.4.71b0", "pgvector>=0.3", "plotly>=5.14", "psycopg[binary]>=3.2",
  "pydantic>=2.10", "pydantic-settings>=2.7", "python-dotenv>=1.0", "python-multipart>=0.0.20", "pypdf>=5.0",
  "python-jose[cryptography]>=3.3", "pytz>=2024.1", "pyyaml>=6.0",
  "email-validator>=2.2",
  "scikit-learn>=1.3", "sqlalchemy>=2.0", "tenacity>=9.0", "uvicorn>=0.31"
]

[project.optional-dependencies]
dev = ["pytest>=8.3", "pytest-asyncio>=0.25", "pytest-cov>=6.0"]

[tool.setuptools.packages.find]
include = ["src*", "backend*"]

[tool.pytest.ini_options]
testpaths = ["tests", "backend/tests"]
addopts = "-q --disable-warnings"
asyncio_mode = "auto"
