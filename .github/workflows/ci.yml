name: CI

on:
  push:
  pull_request:

jobs:
  backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -c requirements.lock -e ".[dev]"
      - run: python -m compileall -q src backend evals mcp_servers
      - run: pytest --cov=backend --cov=src --cov-report=term-missing
      - name: Offline Agent workflow contracts (no API keys)
        run: python -m evals.runners.benchmark --engine replay --suite full --output-dir data/evals/ci
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: agent-evaluation-offline
          path: data/evals/ci/
          if-no-files-found: warn

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
