services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_DB: goldagent
      POSTGRES_USER: goldagent
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-goldagent-dev}
    volumes:
      - goldagent-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U goldagent -d goldagent"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://goldagent:${POSTGRES_PASSWORD:-goldagent-dev}@postgres:5432/goldagent
      DEMO_MODE: ${DEMO_MODE:-true}
      FRONTEND_ORIGINS: http://localhost:3000
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://registry.npmjs.org}
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  goldagent-postgres:
